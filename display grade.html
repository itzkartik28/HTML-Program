<!doctype html>
<html>
<head>
<title>
display grades</title>
</head>
<body>
<script>
let marks=75;

if(marks>=90){
document.write("grade:A");
}
else if(marks>=75){
document.write("grade:B");
}
else if(marks>=50){
document.write("grade:C");
}
else{
document.write("fail");
}
</script>
</body>
</html>
