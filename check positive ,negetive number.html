<!document html>
<html>
<head>
<title>check number is positive,negative number</title>
</head>
<body>
<script>
let number=9;
if(number>0){
document.write("positive number")
}
else if(number<0){
document.write("negative number")
}
else{
document.write("zero")
}
</script>
</body>
</html>
