<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>
contact us
</title>
</head>
<body>
<h1>contact form</h1>
<p> please fill in the form below to get in touch with us</p>
<form>
<fieldset>
<legend><strong>contact us</strong></legend>
<label>full name:</label><br>
<input type="text" id ="name" name="name" placeholder="your full name " required><br><br>
<label>email address:</label><br>
<input type="email" id ="email" name="email" placeholder="your@example.com" required><br><br>
<label>phone number:</label><br>
<input type="tel" id ="phone" name="phone" placeholder="91+000000000" required><br><br>
<label>company (if any)</label><br>
<input type="text" id ="company" name="company" placeholder="your company name" required><br><br>
</fieldset>

<fieldset>
<legend><strong> your prefernce</strong></legend>
<label>gender</label><br>
<input type="radio" id="name" name="gender" value="male">
<label>male</label>
<input type="radio" id="name" name="gender" value="female">
<label>female</label>
<input type="radio" id="female" name="gender" value="prefer not to say">
<label> prefer not to say</label><br><br>

<label>area of interrest</label><br>
<input type="checkbox" id ="design" name="interest" value="design">
<label>design<label><br>

<input type="checkbox" id="development" name="interest" value="development">
<label>development</label><br>

<input type="checkbox" id="marketing" name="interest" value="marketing">
<label>marketing</label><br><br>
</fieldset>

<fieldset>
<legend><strong>your message</strong></legend>

<label>subject</label><br>
<input type="text" id="subject" name="subject" required><br><br>

<label>message</label><br>
<textarea id="message" name="message" rows="6" cols="50" placeholder="write your message here!" required></textarea>
<br><br></fieldset><br>
<center>
<input type="submit" value="submit form" size="6">
</center>
</form>
</body>
</html>
