<!Doctype html>
<html>
<head>
<title>check greater number</title>
</head>
<body>
<script>
let a=10;
let b=20;
let c=30;

if(a>b && a>c){
document.write("greater is:"+a)
}
else if(b>a && b>c){
document.write("greater is:"+b)
}
else{
document.write("greater is:"+c)
}
</script>
</body>
</html>
