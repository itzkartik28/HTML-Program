<!doctype html>
<html>
<head>
<title>Static Position</title>
<style>
.single {
    width: 150px;
    height: 300px;
    background-color: black;
    align:center;
}

.red {
    background-color: red;
    width: 100px;
    height: 100px;
    border-radius: 50px;
}

.yellow {
    background-color: yellow;
    width: 100px;
    height: 100px;
    border-radius: 50px;
}

.green {
    background-color: green;
    width: 100px;
    height: 100px;
    border-radius: 50px;
}
</style>
</head>
<body>

<div class="single">
    <div class="red"></div>
    <div class="yellow"></div>
    <div class="green"></div>
</div>

</body>
</html>
