<!document html>
<html>
<head>
<title>
electricity bill
</title>
</head>
<body>
<script>
let units=120;
let bill;

if(units<=100){
bill=units*5;
}
else if(units<=200){
bill=units*7;
}
else{
bill=units*10;
}
document.write("electricity bill =$"+bill);
</script>
</body>
</html>
