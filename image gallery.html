<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#333;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.gallery img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:10px;
    cursor:pointer;
    transition:.4s;
    box-shadow:0 5px 10px rgba(0,0,0,.2);
}

.gallery img:hover{
    transform:scale(1.05);
    box-shadow:0 10px 20px rgba(0,0,0,.4);
}

.lightbox{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.9);
    display:none;
    justify-content:center;
    align-items:center;
}

.lightbox img{
    max-width:90%;
    max-height:85%;
    border-radius:10px;
}

.close{
    position:absolute;
    top:20px;
    right:40px;
    font-size:45px;
    color:white;
    cursor:pointer;
}

.lightbox.show{
    display:flex;
}
</style>
<script>
const galleryImages = document.querySelectorAll(".gallery img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const closeBtn = document.querySelector(".close");

galleryImages.forEach(image => {
    image.addEventListener("click", () => {
        lightbox.classList.add("show");
        lightboxImg.src = image.src;
    });
});

closeBtn.addEventListener("click", () => {
    lightbox.classList.remove("show");
});

lightbox.addEventListener("click", (e) => {
    if (e.target !== lightboxImg) {
        lightbox.classList.remove("show");
    }
});

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
        lightbox.classList.remove("show");
    }
});
</script>
</head>
<body>

    <h1>Image Gallery</h1>

    <div class="gallery">
        <img src="https://picsum.photos/id/1015/400/300" alt="">
        <img src="https://picsum.photos/id/1016/400/300" alt="">
        <img src="https://picsum.photos/id/1018/400/300" alt="">
        <img src="https://picsum.photos/id/1020/400/300" alt="">
        <img src="https://picsum.photos/id/1024/400/300" alt="">
        <img src="https://picsum.photos/id/1035/400/300" alt="">
        <img src="https://picsum.photos/id/1040/400/300" alt="">
        <img src="https://picsum.photos/id/1050/400/300" alt="">
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="close">&times;</span>
        <img id="lightbox-img">
    </div>

    <script src="script.js"></script>

</body>
</html>
