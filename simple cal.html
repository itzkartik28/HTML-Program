<!doctype html>
<html>
<head>
<title>
simple calculeter
</title>
</head>
<body>
<script>
let a=10;
let b=90;
let choice="+";

switch(choice){

case "+":
document.write("addition="+(a+b))
break;

case "-":
document.write("substraction:"+(a-b))
break;

case"*":
document.write("multiplication:"+(a*b))
break;

case"/":
document.write("divide:"+(a/b))
break;

default:
document.write("invalid choice")
}
</script>
</body>
</html>
