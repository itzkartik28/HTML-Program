<!doctype html>
<html>
<head>
<title>absolute position</title>
<style>
.parent{
width:300px;
height:300px;
background-color:yellow;
position:relative;
left:50px;
top:20px;
}

.child{
width:100px;
height:100px;
background-color:red;
position:absoute;
left:50px;
top:20px;
}

</style>
</head>
<body>
<div class="parent">
<b>this is parent class</b>
<div class="child">
<p>this is child class</p>
</div>
</div>
</body>
</html>
