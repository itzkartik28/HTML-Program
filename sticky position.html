<!doctype html>
<html>
<head>
<title>sticky position</title>
<style>
.header{
background-color:pink;
color:yellow;
padding:15px;
position:sticky;
top:10px;
}
.content{
height:1000px;
}
</style>
</head>
<body>
<div class="header">
<p>sticky header</p>
</div>
<div class="content">
<p>scroll down to see sticky header</p>
</div>
</body>
</html>
